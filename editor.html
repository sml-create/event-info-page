<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>白紙からつくるページ編集ツール</title>
<style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;color:#111;background:#ededed;font:14px/1.6 sans-serif}.tools{background:#fff;border-bottom:1px solid #ccc;padding:14px 20px}.tools h1{font-size:17px;margin:0 0 10px}.row{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:8px 0}button,select,input{font:inherit;padding:8px 10px;border:1px solid #aaa;border-radius:4px;background:#fff;color:#111}button{cursor:pointer}button.primary,button[aria-pressed="true"]{background:#222;color:#fff}button:disabled{opacity:.4;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #3678bd;outline-offset:2px}.tools p{font-size:12px;margin:6px 0;color:#444}#stage{padding:20px;overflow:auto}iframe{display:block;width:100%;height:70vh;min-height:480px;border:0;margin:auto;background:#fff;box-shadow:0 2px 10px #0001}#stage.mobile iframe{width:390px;max-width:100%}#status{font-size:12px}#title{max-width:240px}@media(max-width:600px){.tools{padding:12px}#stage{padding:8px}button,select,input{font-size:12px}}
</style></head><body>
<header class="tools"><h1>白紙からつくるページ編集ツール</h1>
<div class="row"><button id="edit" aria-pressed="true">編集</button><button id="preview" aria-pressed="false">プレビュー</button><label>表示幅 <select id="width"><option value="desktop">PC</option><option value="mobile">スマートフォン</option></select></label><label>ブラウザのタブ名 <input id="title" value="ご案内" maxlength="120"></label></div>
<div class="row" id="editing-tools"><label>追加する種類 <select id="kind"><option value="p">本文</option><option value="h1">大見出し</option><option value="h2">中見出し</option><option value="h3">小見出し</option></select></label><button id="add">文章を追加</button><button id="bold"><b>太字</b></button><button id="list">箇条書き</button><button id="link">リンク設定</button><button id="unlink">リンク解除</button><button id="up">上へ</button><button id="down">下へ</button><button id="remove">選択した文章を削除</button></div>
<div class="row"><button id="save">編集用コピーを保存</button><button class="primary" id="download">公開用HTMLをダウンロード</button><span id="status" role="status">白紙です</span></div>
<p id="help">「文章を追加」から始めてください。選んだ文章の後に追加します。配置は文章の順序で調整できます。Enterで改行、文字を選択して太字・リンクを設定できます。</p><p>自動保存はありません。終了前に「編集用コピーを保存」してください。公開用HTMLの保存だけではWebサイトは更新されません。</p>
</header><div id="stage"><iframe id="page" title="ページの編集とプレビュー" sandbox="allow-same-origin"></iframe></div>
<script id="saved-document" type="application/json">{"title":"ご案内","blocks":[]}</script>
<script>
'use strict';
const pageCSS="*{box-sizing:border-box}html{color-scheme:light}body{margin:0;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",\"Hiragino Kaku Gothic ProN\",Meiryo,sans-serif;font-size:16px;line-height:1.9;overflow-wrap:anywhere}main{max-width:800px;margin:auto;padding:48px 28px 80px}h1,h2,h3{line-height:1.5;margin:0;font-weight:700}h1{font-size:32px}h2{font-size:25px}h3{font-size:20px}p{margin:0}a{color:#1753a0;text-decoration:underline}ul,ol{padding-left:1.6em;margin:.5em 0}.text-block{margin:0 0 24px;white-space:pre-wrap}.text-block>*{white-space:normal}.text-block div{white-space:pre-wrap}@media(max-width:600px){main{padding:28px 20px 60px}h1{font-size:27px}h2{font-size:23px}h3{font-size:19px}}";
const data=JSON.parse(document.getElementById('saved-document').textContent);
const frame=document.getElementById('page'),status=document.getElementById('status');
let doc,selected=null,editing=true,dirty=false;
const titleInput=document.getElementById('title');titleInput.value=data.title;
function safeHTML(value){
 const template=document.createElement('template');template.innerHTML=value;
 const allowed=new Set(['B','STRONG','I','EM','U','BR','DIV','P','UL','OL','LI','A']);
 function clean(parent){for(const el of [...parent.children]){if(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','IMG','SVG','MATH','FORM','INPUT'].includes(el.tagName)){el.remove();continue;}clean(el);if(!allowed.has(el.tagName)){el.replaceWith(...el.childNodes);continue;}const href=el.getAttribute('href');for(const attr of [...el.attributes])el.removeAttribute(attr.name);if(el.tagName==='A'&&href&&/^(https?:\/\/|mailto:|#)/i.test(href.trim()))el.setAttribute('href',href.trim());}}
 clean(template.content);return template.innerHTML;
}
function changed(){dirty=true;status.textContent='未保存の変更があります';}
function buttons(){for(const id of ['bold','list','link','unlink','up','down','remove'])document.getElementById(id).disabled=!selected;}
function select(el){selected=el;doc.querySelectorAll('.selected').forEach(e=>e.classList.remove('selected'));if(el)el.classList.add('selected');buttons();}
function makeBlock(tag,html){const el=doc.createElement(['h1','h2','h3'].includes(tag)?tag:'div');el.className='text-block';el.dataset.kind=['h1','h2','h3'].includes(tag)?tag:'p';el.contentEditable='true';el.setAttribute('aria-label',el.dataset.kind==='p'?'本文':'見出し');el.dataset.placeholder=el.dataset.kind==='p'?'本文を入力':'見出しを入力';el.innerHTML=safeHTML(html);return el;}
function blocks(){return [...doc.querySelector('main').children].map(el=>({kind:el.dataset.kind,html:safeHTML(el.innerHTML)}));}
function output(){const html=doc.documentElement.cloneNode(true);html.querySelector('#editing-style').remove();html.querySelector('body').removeAttribute('class');html.querySelector('title').textContent=titleInput.value||'ご案内';for(const el of html.querySelector('main').children){const clean=doc.createElement(el.dataset.kind==='p'?'div':el.dataset.kind);clean.className='text-block';clean.innerHTML=safeHTML(el.innerHTML);el.replaceWith(clean);}return '<!doctype html>\n'+html.outerHTML;}
function download(text,name){const url=URL.createObjectURL(new Blob([text],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
frame.addEventListener('load',()=>{doc=frame.contentDocument;for(const block of data.blocks)doc.querySelector('main').append(makeBlock(block.kind,block.html));doc.addEventListener('focusin',e=>{const block=e.target.closest('.text-block');if(block)select(block);});doc.addEventListener('input',changed);doc.addEventListener('paste',e=>{if(!editing)return;e.preventDefault();doc.execCommand('insertText',false,e.clipboardData.getData('text/plain'));});doc.addEventListener('drop',e=>e.preventDefault());doc.addEventListener('click',e=>{if(editing&&e.target.closest('a'))e.preventDefault();});if(data.blocks.length)status.textContent='保存した内容を開きました';buttons();});
frame.srcdoc='<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ご案内</title><style>'+pageCSS+'</style><style id="editing-style">body.editing .text-block{outline:1px dashed #aaa;outline-offset:5px;min-height:1.9em}body.editing .text-block.selected{outline:2px solid #333}body.editing .text-block:empty:before{content:attr(data-placeholder);color:#999;pointer-events:none}</style></head><body class="editing"><main></main></body></html>';
document.getElementById('add').onclick=()=>{if(!doc)return;const el=makeBlock(document.getElementById('kind').value,'');if(selected)selected.after(el);else doc.querySelector('main').append(el);select(el);el.focus();changed();};
function mode(value){editing=value;doc.body.classList.toggle('editing',value);doc.querySelectorAll('.text-block').forEach(el=>el.contentEditable=String(value));document.getElementById('editing-tools').hidden=!value;document.getElementById('edit').setAttribute('aria-pressed',String(value));document.getElementById('preview').setAttribute('aria-pressed',String(!value));document.getElementById('help').textContent=value?'文章をクリックして編集します。選んだ文章の後に追加できます。Enterで改行、文字を選択して太字・リンクを設定できます。':'公開時の見た目です。編集を続けるには「編集」を押してください。';}
document.getElementById('edit').onclick=()=>mode(true);document.getElementById('preview').onclick=()=>mode(false);
document.getElementById('width').onchange=e=>document.getElementById('stage').classList.toggle('mobile',e.target.value==='mobile');
for(const id of ['bold','list','link','unlink'])document.getElementById(id).onmousedown=e=>e.preventDefault();
function command(name,value){if(!selected)return;const selection=doc.getSelection();if(!selection.rangeCount||!selected.contains(selection.anchorNode))selected.focus();doc.execCommand(name,false,value);changed();}
document.getElementById('bold').onclick=()=>command('bold');document.getElementById('list').onclick=()=>command('insertUnorderedList');document.getElementById('unlink').onclick=()=>command('unlink');
document.getElementById('link').onclick=()=>{if(!selected)return;const selection=doc.getSelection();if(selection.isCollapsed){alert('先にリンクにする文字をドラッグして選択してください。');return;}const range=selection.getRangeAt(0).cloneRange();const url=prompt('リンク先を入力してください（https://、http://、mailto:、#）');if(url===null)return;if(!/^(https?:\/\/|mailto:|#)/i.test(url.trim())){alert('https:// などから始まるURLを入力してください。');return;}selection.removeAllRanges();selection.addRange(range);command('createLink',url.trim());};
document.getElementById('up').onclick=()=>{if(selected?.previousElementSibling){selected.previousElementSibling.before(selected);changed();}};
document.getElementById('down').onclick=()=>{if(selected?.nextElementSibling){selected.nextElementSibling.after(selected);changed();}};
document.getElementById('remove').onclick=()=>{if(!selected)return;selected.remove();select(null);changed();};
titleInput.oninput=changed;
document.getElementById('download').onclick=()=>{download(output(),'index.html');status.textContent='公開用HTMLを出力しました。編集用コピーも保存してください。';};
document.getElementById('save').onclick=()=>{const copy=document.documentElement.cloneNode(true);copy.querySelector('#saved-document').textContent=JSON.stringify({title:titleInput.value,blocks:blocks()}).replace(/</g,'\\u003c');copy.querySelector('#page').removeAttribute('srcdoc');download('<!doctype html>\n'+copy.outerHTML,'editor.html');dirty=false;status.textContent='編集用コピーを出力しました。保存先をご確認ください。';};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
</script></body></html>
