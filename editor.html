:11px}.agenda-item{gap:17px}.agenda-time{font-size:12px}.agenda-item h3{font-size:12px}.speaker-card{align-items:flex-start;gap:17px}.speaker-avatar{min-width:74px;height:74px}.speaker-avatar:before{width:26px;height:30px;left:25px;top:15px}.speaker-avatar:after{width:60px;height:55px;left:8px;bottom:-23px}.speaker-card h3{font-size:18px}.speaker-role{font-size:9px}.steps li{gap:14px}.steps p{font-size:11px}.application-box{padding:26px 14px}.application-box h3{font-size:13px}.demo-status{font-size:10px!important}.notes{margin-bottom:0}footer{padding:30px 20px}.notes li{font-size:11px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.button{transition:none}}\n\n[data-field=\"overview\"],[data-field=\"shortTitle\"]{white-space:pre-line}\n.tags span span{border:0;padding:0;font:inherit}\n\u003c/style>\n\n\u003c/head>\n\u003cbody>\n\u003cheader class=\"site-header\">\n  \u003ca class=\"brand\" href=\"#\" aria-label=\"ページの先頭へ\">\u003cspan class=\"brand-mark\" aria-hidden=\"true\">s\u003cspan>･\u003c/span>\u003c/span>\u003cspan>SAMPLE BUSINESS\u003c/span>\u003c/a>\n  \u003cspan class=\"header-label\">イベントのご案内\u003c/span>\n\u003c/header>\n\u003cmain>\n  \u003c!-- 編集：実際の情報に差し替えた後、このサンプル案内を削除してください。 -->\n  \u003cdiv class=\"sample-banner\">サンプルイベントのご案内 \u003cspan>日程・条件・特典はすべて仮の内容です。現在、応募は受け付けていません。\u003c/span>\u003c/div>\n  \u003csection class=\"hero\" aria-labelledby=\"event-title\">\n    \u003cdiv class=\"hero-copy\">\n      \u003cp class=\"eyebrow\">TIKTOK CREATIVE CHALLENGE\u003c/p>\n      \u003cdiv class=\"tags\">\u003cspan>TikTok投稿イベント\u003c/span>\u003cspan>参加無料\u003c/span>\u003c/div>\n      \u003c!-- 編集：イベント名・紹介文 -->\n      \u003ch1 id=\"event-title\">わたしの小さな発見。\nあなたの動画で、届けよう。\u003c/h1>\n      \u003cp class=\"hero-description\">いつもの暮らしで見つけた、ちょっと素敵な瞬間。\nあなただけの視点を、TikTokの動画でシェアしませんか。\u003c/p>\n      \u003cdiv class=\"hero-date\">\u003cspan class=\"date-icon\" aria-hidden=\"true\">▦\u003c/span>\u003cdiv>\u003cstrong>2026年11月1日〜11月30日\u003c/strong>\u003cp>23:59 投稿締切\u003csmall>日本時間\u003c/small>\u003c/p>\u003c/div>\u003c/div>\n      \u003ca class=\"button\" href=\"#participation\">投稿方法を確認する \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\n      \u003cp class=\"hero-caption\">スマートフォンから、あなたらしい一本を。\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"hero-art\" aria-hidden=\"true\">\u003cdiv class=\"art-grid\">\u003c/div>\u003cspan class=\"art-caption\">YOUR MOMENT.\u003cbr>YOUR STORY.\u003c/span>\u003cdiv class=\"art-orbit orbit-one\">\u003c/div>\u003cdiv class=\"art-orbit orbit-two\">\u003c/div>\u003cdiv class=\"art-card card-back\">\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003c/div>\u003cdiv class=\"art-card card-front\">\u003cdiv class=\"chart-header\">\u003ci>\u003c/i>\u003cspan>SHARE YOUR IDEAS\u003c/span>\u003cb>↗\u003c/b>\u003c/div>\u003cdiv class=\"chart\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/div>\u003cdiv class=\"chart-line\">\u003c/div>\u003csmall>何気ない毎日が、物語になる。\u003c/small>\u003c/div>\u003cspan class=\"art-dot dot-one\">\u003c/span>\u003cspan class=\"art-dot dot-two\">\u003c/span>\u003cspan class=\"art-note\">CREATE &amp; SHARE\u003c/span>\u003c/div>\n  \u003c/section>\n  \u003cnav class=\"section-nav\" aria-label=\"ページ内メニュー\">\u003ca href=\"#overview\">イベント概要\u003c/a>\u003ca href=\"#participation\">投稿方法\u003c/a>\u003ca href=\"#prizes\">入賞特典\u003c/a>\u003ca href=\"#judging\">審査方法\u003c/a>\u003c/nav>\n  \u003cdiv class=\"page-body\">\u003cdiv class=\"main-column\">\n    \u003c!-- 編集：イベント概要。日程はページ上部・右側の要約にもあります。 -->\n    \u003csection id=\"overview\" class=\"section\">\n      \u003cp class=\"eyebrow\">OVERVIEW\u003c/p>\u003ch2>イベント概要\u003c/h2>\n      \u003cp class=\"section-intro\">テーマは「暮らしの中の小さな発見」。\u003cbr>身近な風景や工夫、心が動いた瞬間を短い動画にして投稿するイベントです。撮影・編集の経験は問いません。\u003c/p>\n      \u003cdl class=\"overview-table\">\n        \u003cdiv>\u003cdt>募集期間\u003c/dt>\u003cdd>2026年11月1日（日）〜11月30日（月）\u003csmall>最終日23:59まで／日本時間\u003c/small>\u003c/dd>\u003c/div>\n        \u003cdiv>\u003cdt>投稿先\u003c/dt>\u003cdd>TikTok\u003c/dd>\u003c/div>\n        \u003cdiv>\u003cdt>テーマ\u003c/dt>\u003cdd>暮らしの中の小さな発見\u003c/dd>\u003c/div>\n        \u003cdiv>\u003cdt>指定タグ\u003c/dt>\u003cdd>#小さな発見チャレンジ2026\u003csmall>仮のハッシュタグです。公開前に正式なものへ変更してください。\u003c/small>\u003c/dd>\u003c/div>\n        \u003cdiv>\u003cdt>参加費\u003c/dt>\u003cdd>\u003cspan class=\"free\">無料\u003c/span>\u003csmall>通信費・制作費等は参加者のご負担となります。\u003c/small>\u003c/dd>\u003c/div>\n        \u003cdiv>\u003cdt>主催\u003c/dt>\u003cdd>株式会社サンプル\u003c/dd>\u003c/div>\n      \u003c/dl>\n    \u003c/section>\n    \u003c!-- 編集：TikTok投稿方法。アカウントやタグは実際のものに差し替えてください。 -->\n    \u003csection id=\"participation\" class=\"section\">\n      \u003cp class=\"eyebrow\">HOW TO JOIN\u003c/p>\u003ch2>TikTok投稿方法\u003c/h2>\n      \u003col class=\"steps\">\n        \u003cli>\u003cspan>01\u003c/span>\u003cdiv>\u003ch3>テーマに沿った動画を撮影\u003c/h3>\u003cp>「暮らしの中の小さな発見」をテーマに、15〜60秒のオリジナル動画を制作してください。縦型の動画をおすすめします。\u003c/p>\u003c/div>\u003c/li>\n        \u003cli>\u003cspan>02\u003c/span>\u003cdiv>\u003ch3>指定ハッシュタグを付けて投稿\u003c/h3>\u003cp>キャプションに「#小さな発見チャレンジ2026」を記載し、募集期間内にTikTokへ投稿してください。\u003c/p>\u003c/div>\u003c/li>\n        \u003cli>\u003cspan>03\u003c/span>\u003cdiv>\u003ch3>投稿を公開状態にする\u003c/h3>\u003cp>審査が終わるまで、アカウントと対象動画を公開状態にしてください。非公開・削除済みの動画は審査できません。\u003c/p>\u003c/div>\u003c/li>\n      \u003c/ol>\n      \u003cdiv class=\"application-box\">\u003ch3>あなたらしい発見を、一本の動画に。\u003c/h3>\u003cp>参加条件と注意事項をご確認のうえ、ご参加ください。\u003c/p>\u003cp class=\"demo-status\">現在はサンプルです。応募は受け付けていません。\u003c/p>\u003c/div>\n    \u003c/section>\n    \u003c!-- 編集：参加条件 -->\n    \u003csection id=\"conditions\" class=\"section\">\n      \u003cp class=\"eyebrow\">ELIGIBILITY\u003c/p>\u003ch2>参加条件\u003c/h2>\n      \u003cdiv class=\"audience\">\u003ch3>投稿前にご確認ください\u003c/h3>\u003cul>\n        \u003cli>日本国内にお住まいの18歳以上の方（サンプル条件）。\u003c/li>\n        \u003cli>TikTokの利用規約を満たす、ご本人のアカウントでご参加ください。\u003c/li>\n        \u003cli>応募者ご本人が制作し、必要な権利・許諾を得た動画に限ります。\u003c/li>\n        \u003cli>テーマ・指定ハッシュタグ・動画の長さ・募集期間を満たしてください。\u003c/li>\n        \u003cli>お一人で複数投稿できます。ただし入賞はお一人1作品までとします。\u003c/li>\n      \u003c/ul>\u003c/div>\n    \u003c/section>\n    \u003c!-- 編集：入賞特典。実物・人数・金額・受取条件を確定してください。 -->\n    \u003csection id=\"prizes\" class=\"section\">\n      \u003cp class=\"eyebrow\">PRIZES\u003c/p>\u003ch2>入賞特典\u003c/h2>\n      \u003cp class=\"section-intro\">テーマに沿った素敵な作品に、以下の特典をお贈りします。すべて仮の内容です。\u003c/p>\n      \u003cdiv class=\"agenda\">\n        \u003cdiv class=\"agenda-item\">\u003cspan class=\"agenda-time\">01\u003c/span>\u003cdiv>\u003ch3>グランプリ｜1名\u003c/h3>\u003cp>デジタルギフト 10,000円相当（予定）\u003c/p>\u003c/div>\u003c/div>\n        \u003cdiv class=\"agenda-item\">\u003cspan class=\"agenda-time\">02\u003c/span>\u003cdiv>\u003ch3>アイデア賞｜3名\u003c/h3>\u003cp>デジタルギフト 各3,000円相当（予定）\u003c/p>\u003c/div>\u003c/div>\n        \u003cdiv class=\"agenda-item\">\u003cspan class=\"agenda-time\">03\u003c/span>\u003cdiv>\u003ch3>特典のお届け\u003c/h3>\u003cp>入賞連絡後に受取方法をご案内します。特典の種類・送付時期・受取条件は公開前に確定します。\u003c/p>\u003c/div>\u003c/div>\n      \u003c/div>\n    \u003c/section>\n    \u003c!-- 編集：審査基準・連絡方法・日程 -->\n    \u003csection id=\"judging\" class=\"section\">\n      \u003cp class=\"eyebrow\">JUDGING\u003c/p>\u003ch2>審査方法・結果発表\u003c/h2>\n      \u003cp class=\"section-intro\">主催者の審査担当が、参加条件を満たした作品を以下の観点で審査します。再生数や「いいね」数だけで順位を決めるものではありません。\u003c/p>\n      \u003cdiv class=\"audience\">\u003ch3>審査のポイント\u003c/h3>\u003cul>\u003cli>テーマとのつながりが伝わること\u003c/li>\u003cli>自分らしい視点や工夫があること\u003c/li>\u003cli>映像やストーリーが見る人の心に残ること\u003c/li>\u003c/ul>\u003c/div>\n      \u003cdl class=\"overview-table\">\n        \u003cdiv>\u003cdt>審査期間\u003c/dt>\u003cdd>2026年12月1日〜12月10日（予定）\u003c/dd>\u003c/div>\n        \u003cdiv>\u003cdt>結果連絡\u003c/dt>\u003cdd>2026年12月中旬（予定）\u003csmall>入賞候補者に主催者の公式TikTokアカウントからDMで連絡します。返信期限は連絡時にご案内します。\u003c/small>\u003c/dd>\u003c/div>\n        \u003cdiv>\u003cdt>公式窓口\u003c/dt>\u003cdd>正式なアカウントは準備中です。公開前にここへアカウント名とURLを記載します。\u003c/dd>\u003c/div>\n      \u003c/dl>\n      \u003cp class=\"muted\">個別の審査理由へのお問い合わせにはお答えできません。主催者から送金やカード情報の入力を求めることはありません。\u003c/p>\n    \u003c/section>\n    \u003c!-- 編集：注意事項・問い合わせ先。実際の運営ルールを確認してください。 -->\n    \u003csection id=\"notes\" class=\"section notes\">\n      \u003cp class=\"eyebrow\">INFORMATION\u003c/p>\u003ch2>注意事項\u003c/h2>\n      \u003cul>\n        \u003cli>第三者の著作権・肖像権・プライバシー等を侵害する投稿は禁止します。人物の映り込みや音源の利用についても、必要な許諾と利用条件を確認してください。\u003c/li>\n        \u003cli>危険な撮影、公序良俗に反する内容、差別・誹謗中傷、個人情報を含む投稿は対象外です。\u003c/li>\n        \u003cli>TikTokの利用規約・コミュニティガイドラインと、使用する音源の利用条件を守ってください。\u003c/li>\n        \u003cli>募集期間外の投稿、指定タグのない投稿、非公開の投稿、不正が認められた投稿は審査対象外です。\u003c/li>\n        \u003cli>応募動画の主催者による二次利用は、別途ご本人の許諾を得るものとします。\u003c/li>\n        \u003cli>入賞連絡・特典送付のために取得する個人情報の取り扱いは、公開前に主催者の方針と案内先を確定します。\u003c/li>\n        \u003cli>やむを得ない事情で内容を変更・中止する場合は、このページでご案内します。\u003c/li>\n        \u003cli>本イベントは主催者が実施するものであり、TikTokが主催・協賛・運営するものではありません。\u003c/li>\n      \u003c/ul>\n      \u003cdiv class=\"contact\">\u003ch3>お問い合わせ\u003c/h3>\u003cp>株式会社サンプル　TikTok投稿イベント事務局\u003c/p>\u003cp class=\"muted\">問い合わせ先は準備中です。公開前に正式なメールアドレス等を記載してください。\u003c/p>\u003c/div>\n    \u003c/section>\n  \u003c/div>\n  \u003c!-- 編集：PC用の要約。本文の募集期間・締切とそろえてください。 -->\n  \u003caside class=\"summary-card\" aria-label=\"イベント要点\">\u003cspan class=\"live-label\">\u003ci>\u003c/i> TIKTOK EVENT\u003c/span>\u003ch2>あなたの発見が、\u003cbr>誰かのきっかけに。\u003c/h2>\u003cdl>\u003cdt>募集期間\u003c/dt>\u003cdd>2026年11月1日〜11月30日\u003c/dd>\u003cdt>投稿締切\u003c/dt>\u003cdd>最終日23:59／日本時間\u003c/dd>\u003cdt>参加費\u003c/dt>\u003cdd>無料\u003c/dd>\u003c/dl>\u003ca class=\"button\" href=\"#participation\">投稿方法を見る \u003cspan aria-hidden=\"true\">↓\u003c/span>\u003c/a>\u003cp>ご参加の前に条件をご確認ください。\u003c/p>\u003c/aside>\n  \u003c/div>\n\u003c/main>\n\u003cfooter>\u003ca class=\"footer-brand\" href=\"#\">SAMPLE BUSINESS\u003c/a>\u003cp>本ページのイベント内容・日程・特典はサンプルです。\u003c/p>\u003csmall>© 2026 SAMPLE BUSINESS\u003c/small>\u003c/footer>\n\u003c/body>\n\u003c/html>\n"</script>
<script>
'use strict';
const frame=document.getElementById('page');
let editing=true,dirty=false;
const status=document.getElementById('status');
const editStyle='[data-edit-text][contenteditable="true"]{outline:1px dashed #769e83;outline-offset:2px;cursor:text;white-space:pre-wrap}[data-edit-text][contenteditable="true"]:focus{outline:2px solid #18574e;background:#f0f7df}';
frame.addEventListener('load',()=>{
 const doc=frame.contentDocument;
 const walker=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT);
 const nodes=[];while(walker.nextNode()){const node=walker.currentNode;if(node.textContent.trim()&&!node.parentElement.closest('[aria-hidden="true"],style,script'))nodes.push(node);}
 for(const node of nodes){const span=doc.createElement('span');span.dataset.editText='';span.textContent=node.textContent;node.replaceWith(span);}
 const style=doc.createElement('style');style.id='editor-outlines';style.textContent=editStyle;doc.head.append(style);
 doc.addEventListener('input',()=>{dirty=true;status.textContent='未保存の変更があります';});
 doc.addEventListener('paste',e=>{if(!editing)return;e.preventDefault();doc.execCommand('insertText',false,e.clipboardData.getData('text/plain'));});
 doc.addEventListener('drop',e=>e.preventDefault());
 doc.addEventListener('click',e=>{if(editing&&e.target.closest('a'))e.preventDefault();});
 applyMode();
});
frame.srcdoc=JSON.parse(document.getElementById('page-source').textContent);
function applyMode(){
 frame.contentDocument.querySelectorAll('[data-edit-text]').forEach(el=>{el.contentEditable=String(editing);if(!editing){el.style.whiteSpace='pre-wrap';}});
 document.getElementById('edit').setAttribute('aria-pressed',String(editing));document.getElementById('preview').setAttribute('aria-pressed',String(!editing));
 document.getElementById('help').textContent=editing?'文章をクリックして編集できます。Enterで改行できます。日程や企業名など、同じ文章が複数箇所にある場合はそれぞれ修正してください。':'プレビュー中です。枠線を消し、公開用ページと同じ表示を確認しています。編集を続ける場合は「編集モード」を押してください。';
}
function cleanPage(){
 const copy=frame.contentDocument.documentElement.cloneNode(true);
 copy.querySelector('#editor-outlines')?.remove();
 const originals=frame.contentDocument.querySelectorAll('[data-edit-text]');
 copy.querySelectorAll('[data-edit-text]').forEach((el,i)=>{
  const text=originals[i].innerText;
  const span=document.createElement('span');span.style.whiteSpace='pre-wrap';span.textContent=text;el.replaceWith(span);
 });
 const title=copy.querySelector('#event-title')?.textContent;
 if(title)copy.querySelector('title').textContent=title.replace(/\n/g,' ')+' | イベントのご案内';
 return '<!doctype html>\n'+copy.outerHTML;
}
function download(text,name){const url=URL.createObjectURL(new Blob([text],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.getElementById('edit').onclick=()=>{editing=true;applyMode();};
document.getElementById('preview').onclick=()=>{editing=false;applyMode();};
document.getElementById('width').onchange=e=>document.getElementById('stage').classList.toggle('mobile',e.target.value==='mobile');
document.getElementById('download').onclick=()=>{download(cleanPage(),'index.html');status.textContent='公開用HTMLを出力しました。編集を再開するには編集用コピーも保存してください。';};
document.getElementById('save-editor').onclick=()=>{
 const copy=document.documentElement.cloneNode(true);
 copy.querySelector('#page-source').textContent=JSON.stringify(cleanPage()).replace(/</g,'\\u003c');
 copy.querySelector('#status').textContent='編集中';
 copy.querySelector('#page').removeAttribute('srcdoc');
 download('<!doctype html>\n'+copy.outerHTML,'editor.html');dirty=false;status.textContent='編集用コピーを出力しました。ダウンロード先をご確認ください。';
};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
</script></body></html>
